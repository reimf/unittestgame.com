default:
  image: node:latest

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - compile
  - test
  - deploy

typescript:
  stage: compile
  script:
    - npm clean-install
    - npx tsc --build --force --verbose
  artifacts:
    paths:
      - "src/**/*.js*"
      - "test/**/*.js*"

playwright:
  stage: test
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  variables:
    NO_COLOR: "1"
  script:
    - npm clean-install
    - npx playwright test --quiet
    - node -e 'const {branches} = require("./playwright-coverage/coverage-summary.json").total; if (branches.pct < 100) { console.error("Branch coverage is " + branches.pct + "%, it must be 100%"); process.exit(1); } console.log("Branch coverage is 100%");'
  coverage: '/Branches\s*:\s*[\d.]+\%/'
  artifacts:
    paths:
      - playwright-report/
      - playwright-coverage/

pages:
  stage: deploy
  script:
    - npm clean-install
    - mkdir -p public/src
    - cp *.{css,ico,jpg,png,txt} _redirects public
    - cp -r en nl de fr es it public
    - cp src/theme.{js,js.map} public/src
    # one file per page instead of a chain of module imports, so slow connections wait for one download instead of five rounds
    - npx esbuild src/game.ts src/index.ts --bundle --format=esm --minify --sourcemap --outdir=public/src
    - gzip -k -6 public/*.css public/{en,nl,de,fr,es,it}/*.html public/src/*.js
  artifacts:
    paths:
      - public
