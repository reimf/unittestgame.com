default:
  image: node:latest

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - compile
  - test
  - deploy

typescript:
  stage: compile
  script:
    - npm clean-install
    - npx tsc --build --force --verbose
  artifacts:
    paths:
      - "src/**/*.js*"
      - "test/**/*.js*"
      - "index.js*"

playwright:
  stage: test
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  variables:
    NO_COLOR: "1"
  script:
    - npm clean-install
    - npx playwright test --quiet
    - node -e 'const {branches} = require("./playwright-coverage/coverage-summary.json").total; if (branches.pct < 100) { console.error("Branch coverage is " + branches.pct + "%, it must be 100%"); process.exit(1); } console.log("Branch coverage is 100%");'
  coverage: '/Branches\s*:\s*[\d.]+\%/'
  artifacts:
    paths:
      - playwright-report/
      - playwright-coverage/

pages:
  stage: deploy
  script:
    - mkdir -p public/src
    - cp *.{css,html,ico,png,txt} index.js index.js.map public
    - cp src/*.{js,js.map} public/src
    - gzip -k -6 public/*.{css,html,js} public/src/*.js
  artifacts:
    paths:
      - public
