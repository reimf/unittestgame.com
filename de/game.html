<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="description" content="Spiele UnitTestGame im Browser: Füge Unit-Tests hinzu, entlarve die falschen Funktionen des KI-Bots und meistere zehn Level, von leicht bis schwer.">
    <meta name="theme-color" content="#ECE5DD">
    <meta name="viewport" content="width=device-width">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.unittestgame.com/de/game">
    <meta property="og:title" content="UnitTestGame.com">
    <meta property="og:description" content="Spiele UnitTestGame im Browser: Füge Unit-Tests hinzu, entlarve die falschen Funktionen des KI-Bots und meistere zehn Level, von leicht bis schwer.">
    <meta property="og:image" content="https://www.unittestgame.com/og-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="https://www.unittestgame.com/de/game">
    <link rel="alternate" hreflang="en" href="https://www.unittestgame.com/en/game">
    <link rel="alternate" hreflang="nl" href="https://www.unittestgame.com/nl/game">
    <link rel="alternate" hreflang="de" href="https://www.unittestgame.com/de/game">
    <link rel="alternate" hreflang="fr" href="https://www.unittestgame.com/fr/game">
    <link rel="alternate" hreflang="es" href="https://www.unittestgame.com/es/game">
    <link rel="alternate" hreflang="it" href="https://www.unittestgame.com/it/game">
    <link rel="alternate" hreflang="x-default" href="https://www.unittestgame.com/en/game">
    <link rel="icon" type="image/ico" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/shared.css">
    <link rel="stylesheet" href="/game.css">
    <script src="/src/game.js" type="module"></script>
    <script src="/src/theme.js"></script>
    <title>UnitTestGame.com: Spielen</title>
  </head>
  <body>
    <nav>
      <div id="brand">
        <img src="/unittestgame-logo.png" alt="Logo von UnitTestGame" width="160" height="160">
        <span>UnitTestGame</span>
      </div>
      <span id="level-name"></span>
      <div id="nav-links">
        <div id="level-progress">
          <span id="level-progress-label"></span>
          <progress aria-labelledby="level-progress-label"></progress>
        </div>
        <details id="settings-menu">
          <summary class="secondary">Einstellungen</summary>
          <ul>
            <li>
              <button class="secondary" id="theme-toggle" type="button" data-label-light="Hell → Dunkler Modus" data-label-dark="Dunkel → Heller Modus">
                <span aria-hidden="true">⚙&#xFE0E;</span>
                <span>Hell → Dunkler Modus</span>
              </button>
            </li>
            <li>
              <button class="secondary" id="color-toggle" type="button" data-label-color="Farbe → Graustufen" data-label-grayscale="Graustufen → Farbe">
                <span aria-hidden="true">⚙&#xFE0E;</span>
                <span>Farbe → Graustufen</span>
              </button>
            </li>
            <li>
              <details id="language-switcher">
                <summary class="secondary">Deutsch</summary>
                <ul>
                  <li><a class="btn secondary" href="/en/game">English</a></li>
                  <li><a class="btn secondary" href="/nl/game">Nederlands</a></li>
                  <li><a class="btn secondary" href="/fr/game">Français</a></li>
                  <li><a class="btn secondary" href="/es/game">Español</a></li>
                  <li><a class="btn secondary" href="/it/game">Italiano</a></li>
                </ul>
              </details>
            </li>
          </ul>
        </details>
        <a class="btn secondary" href="/de/index">Beenden</a>
      </div>
    </nav>
    <header>
      <h1>Spiele UnitTestGame</h1>
    </header>
    <noscript>
      <p>UnitTestGame braucht JavaScript. Aktiviere JavaScript in deinem Browser, um zu spielen.</p>
    </noscript>
    <main id="screen">
      <div id="messages"></div>
      <aside id="panels"></aside>
    </main>
  </body>
</html>
